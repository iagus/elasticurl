name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          # Statically linked musl binaries for Linux
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
          - target: aarch64-unknown-linux-musl
            os: ubuntu-24.04-arm
          # macOS
          - target: x86_64-apple-darwin
            os: macos-13
          - target: aarch64-apple-darwin
            os: macos-14
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install musl toolchain (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y musl-tools

      - uses: Swatinem/rust-cache@v2

      - name: Build
        run: cargo build --release --locked --target ${{ matrix.target }}

      - name: Package
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
          REF: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          PKG="elasticurl-${REF#v}-${TARGET}"
          mkdir -p "dist/${PKG}/man"
          cp "target/${TARGET}/release/elasticurl" "dist/${PKG}/"
          cp README.md LICENSE "dist/${PKG}/"
          cp man/elasticurl*.1 "dist/${PKG}/man/"
          cd dist
          tar czf "${PKG}.tar.gz" "${PKG}"
          shasum -a 256 "${PKG}.tar.gz" > "${PKG}.tar.gz.sha256"

      - name: Attach to GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.tar.gz*
