[package]
name = "elasticurl"
version = "0.1.0"
edition = "2021"
description = "A tiny, fast Rust CLI for everyday Elasticsearch operations — list indices, check cluster health, inspect mappings and index sizes, list aliases and query indices without memorizing endpoint paths. Single static binary, --help, man pages and shell completions included."
license = "MIT"
repository = "https://github.com/iagus/elasticurl"
keywords = ["elasticsearch", "cli"]
categories = ["command-line-utilities"]

[dependencies]
anyhow = "1"
base64 = "0.22"
clap = { version = "4", features = ["derive", "env"] }
clap_complete = "4"
serde_json = "1"
ureq = { version = "3", default-features = false, features = ["json", "rustls"] }

[build-dependencies]
clap = { version = "4", features = ["derive", "env"] }
clap_complete = "4"
clap_mangen = "0.2"

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
wiremock = "0.6"

# Tuned for binary size: single ~2 MB stripped static binary.
[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
